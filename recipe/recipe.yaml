schema_version: 1

context:
  version: 0.1.0

package:
  name: diffle
  version: ${{ version }}

source:
  url: https://registry.npmjs.org/@moritzwilksch/diffle/-/diffle-${{ version }}.tgz
  sha256: 4baeda75d9541accf7676f3c4ce1927c3617773683e5aec0cfff560f6903fbdf

build:
  number: 0

requirements:
  build:
    - nodejs
    - pnpm
    - pnpm-licenses
  host:
    - nodejs
  run:
    - nodejs

tests:
  - package_contents:
      bin:
        - diffle
  - script:
      - diffle --help
      - diffle --version

about:
  homepage: https://github.com/moritzwilksch/diffle
  summary: Local git diff reviewer in the browser with line comments exported as agent prompts
  license: Apache-2.0
  license_file:
    - LICENSE
    - third-party-licenses.txt
  repository: https://github.com/moritzwilksch/diffle

extra:
  recipe-maintainers:
    - moritzwilksch
    - pavelzw
