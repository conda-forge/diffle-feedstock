schema_version: 1

context:
  version: "0.5.3"

package:
  name: diffle
  version: ${{ version }}

source:
  url: https://github.com/moritzwilksch/diffle/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 3acd6759e4c6c39c8c194e2943366ce930a554b688d2e6f057e12b45f4a9fbcc

build:
  number: 0

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
    - cargo-auditable
    - cmake
    - nodejs >=24.14
    # aws-lc-sys needs clang-cl to assemble its ARM64 sources
    - if: win and arm64
      then: clang
  extras:
    python:
      - pyrefly >=1.3.0
    rust:
      - rust-analyzer
    typescript:
      - typescript-language-server
    go:
      - gopls
    ruby:
      - ruby-lsp
    java:
      - jdtls
    lua:
      - lua-language-server
    terraform:
      - terraform-ls
    json:
      - vscode-langservers-extracted
    yaml:
      - yaml-language-server
    toml:
      - tombi

tests:
  - package_contents:
      bin:
        - diffle
      files:
        - etc/pixi/diffle/global-ignore-conda-prefix
        - share/agent-skills/diffle/SKILL.md
        - if: unix
          then:
            - share/zsh/site-functions/_diffle
            - share/bash-completion/completions/diffle
            - share/fish/vendor_completions.d/diffle.fish
  - script:
      - diffle --help
      - diffle --version
  - script:
      - if: unix
        then: agentskills validate $CONDA_PREFIX/share/agent-skills/diffle
        else: 'agentskills validate %CONDA_PREFIX%\share\agent-skills\diffle'
    requirements:
      run:
        - skills-ref

about:
  homepage: https://diffle.app
  summary: Local git diff reviewer in the browser with line comments exported as agent prompts
  license: Apache-2.0
  license_file:
    - LICENSE
    - THIRD_PARTY_NOTICES.md
    - THIRDPARTY.yml
  repository: https://github.com/moritzwilksch/diffle

extra:
  recipe-maintainers:
    - moritzwilksch
    - pavelzw
