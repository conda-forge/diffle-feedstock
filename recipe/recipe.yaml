schema_version: 1

context:
  version: "0.3.3"

package:
  name: diffle
  version: ${{ version }}

source:
  url: https://github.com/moritzwilksch/diffle/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 48c4a2d5929b2d96a62d0262360f8e81c97da7f19c6b78aaa574c3045e944c58

build:
  number: 0

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
    - cargo-auditable
    - cmake
    - nodejs >=24.14
    # aws-lc-sys needs clang-cl to assemble its ARM64 sources
    - if: win and arm64
      then: clang
  extras:
    python:
      - pyrefly >=1.3.0
    rust:
      - rust-analyzer
    typescript:
      - typescript-language-server
    go:
      - gopls
    ruby:
      - ruby-lsp
    java:
      - jdtls
    lua:
      - lua-language-server
    terraform:
      - terraform-ls
    json:
      - vscode-langservers-extracted
    yaml:
      - yaml-language-server
    toml:
      - tombi

tests:
  - package_contents:
      bin:
        - diffle
      files:
        - etc/pixi/diffle/global-ignore-conda-prefix
        - if: unix
          then:
            - share/zsh/site-functions/_diffle
            - share/bash-completion/completions/diffle
            - share/fish/vendor_completions.d/diffle.fish
  - script:
      - diffle --help
      - diffle --version

about:
  homepage: https://diffle.app
  summary: Local git diff reviewer in the browser with line comments exported as agent prompts
  license: Apache-2.0
  license_file:
    - LICENSE
    - THIRD_PARTY_NOTICES.md
    - THIRDPARTY.yml
  repository: https://github.com/moritzwilksch/diffle

extra:
  recipe-maintainers:
    - moritzwilksch
    - pavelzw
